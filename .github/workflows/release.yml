name: Publish release

on:
  push:
    branches: [main]
    paths: [release-version.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portbridge-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Validate
        run: dotnet run --project tests/PortBridge.Tests -c Release
      - name: Build Windows package
        shell: pwsh
        run: ./build.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content release-version.txt -Raw).Trim()
          [xml]$project = Get-Content src/PortBridge/PortBridge.csproj
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $version -ne $project.Project.PropertyGroup.Version) {
            throw 'Release version must match the application version.'
          }
          $tag = "v$version"
          $notes = @'
          Windows 图形化 SSH 服务转发器。

          支持自定义服务器、多条端口映射、密码或私钥认证、配置导入导出及托盘运行。

          下载 PortBridge-win-x64.zip，解压后运行 PortBridge.exe，无需另行安装 .NET。

          适用于 Windows x64。当前同时连接一组服务器，暂不支持自动重连和开机自启。
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release create $tag dist/PortBridge-win-x64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PortBridge $tag" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed. Existing releases are not overwritten.' }
